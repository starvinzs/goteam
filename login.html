<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Go Team — Entrar</title>
  <meta name="description" content="Acesse sua planilha de treino Go Team." />
  <link rel="icon" href="assets/go-team-logo.png" type="image/png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d3b45" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --petroleo: oklch(0.38 0.07 220);
      --lima: oklch(0.86 0.22 130);
      --bg: oklch(1 0 0);
      --fg: oklch(0.25 0.05 220);
      --muted: oklch(0.5 0.03 220);
      --secondary: oklch(0.96 0.02 220);
      --border: oklch(0.9 0.02 220);
    }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    h1, h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; }
    .text-primary { color: var(--petroleo); }
    .bg-primary { background-color: var(--petroleo); }
    .text-lima { color: var(--lima); }
    .bg-secondary { background-color: var(--secondary); }
    .text-muted { color: var(--muted); }
    .border-border { border-color: var(--border); }
    .focus\:border-lima:focus { border-color: var(--lima); outline: none; }
    .btn-primary { background-color: var(--petroleo); color: white; transition: all .2s; }
    .btn-primary:hover { background-color: var(--lima); color: var(--petroleo); }
    .welcome-bg {
      background: linear-gradient(180deg, rgba(8,40,48,.55) 0%, rgba(8,40,48,.85) 65%, rgba(8,40,48,1) 100%), url('assets/hero-runners.jpg');
      background-size: cover;
      background-position: center;
    }
    .tela { display: none; min-height: 100vh; }
    .tela.active { display: flex; }
  </style>
</head>
<body>

  <!-- ==================== TELA 1: BOAS-VINDAS ==================== -->
  <section id="telaBoasVindas" class="tela active welcome-bg flex-col justify-between px-6 py-10 text-white">
    <div></div>

    <div class="flex flex-col items-center text-center">
      <img src="assets/go-team-logo.png" alt="Go Team" class="h-20 w-auto mb-6 bg-white rounded-2xl p-2" />
      <h1 class="text-3xl mb-2">Boas-vindas ao Go Team!</h1>
      <p class="text-white/75 text-sm max-w-xs">Sua assessoria de corrida no bolso. Planilhas, treinos e acompanhamento em um só lugar.</p>
    </div>

    <div class="flex flex-col gap-3">
      <button id="btnMostrarLogin" class="w-full bg-lima text-primary rounded-full py-3.5 font-bold">Entrar</button>
      <p class="text-center text-sm text-white/70">
        Não tem conta?
        <a href="index.html#planilhas" class="text-lima font-semibold">Ver planos</a>
      </p>
    </div>
  </section>

  <!-- ==================== TELA 2: LOGIN ==================== -->
  <section id="telaLogin" class="tela flex-col px-6 py-8">
    <button id="btnVoltarBoasVindas" class="text-sm font-semibold text-muted mb-6 text-left w-fit">← Voltar</button>

    <div class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full">
      <img src="assets/go-team-logo.png" alt="Go Team" class="h-12 w-auto mb-8" />
      <h2 class="text-3xl mb-2 text-primary">Entrar</h2>
      <p class="text-muted text-sm mb-8">Use o e-mail e a senha do seu cadastro.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-bold uppercase tracking-widest text-muted mb-2">E-mail</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="seu@email.com"
            class="w-full rounded-2xl border-2 border-border bg-white px-5 py-3 text-base focus:border-lima transition" />
        </div>
        <div>
          <label for="senha" class="block text-xs font-bold uppercase tracking-widest text-muted mb-2">Senha</label>
          <input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="••••••••"
            class="w-full rounded-2xl border-2 border-border bg-white px-5 py-3 text-base focus:border-lima transition" />
        </div>
        <div id="erro" class="hidden text-sm font-semibold text-red-600"></div>
        <button type="submit" class="btn-primary w-full inline-flex items-center justify-center rounded-full px-8 py-4 text-base font-bold">
          Entrar
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-sm text-muted mb-3">Ainda não é aluno ou não recebeu seu acesso?</p>
        <a href="https://wa.me/5517982309000?text=Olá!%20Já%20efetuei%20o%20pagamento%20e%20quero%20receber%20meu%20acesso%20à%20área%20do%20aluno."
          target="_blank" rel="noreferrer"
          class="inline-flex items-center gap-2 rounded-full px-6 py-3 text-sm font-bold" style="background: oklch(0.7 0.2 145); color: white;">
          💬 Falar no WhatsApp
        </a>
      </div>
    </div>
  </section>

  <script>
    document.getElementById("btnMostrarLogin").addEventListener("click", () => {
      document.getElementById("telaBoasVindas").classList.remove("active");
      document.getElementById("telaLogin").classList.add("active");
    });
    document.getElementById("btnVoltarBoasVindas").addEventListener("click", () => {
      document.getElementById("telaLogin").classList.remove("active");
      document.getElementById("telaBoasVindas").classList.add("active");
    });
  </script>

  <script>
    const SUPABASE_URL = "https://euteamspjorplhtopjzf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DRPo2RBO9EQv7TSCeVT34A_A4IFK39v";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Se já existe sessão ativa, pula a tela de boas-vindas e vai direto pro app
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) location.href = "app.html";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = String(fd.get("email") || "").trim().toLowerCase();
      const senha = String(fd.get("senha") || "");
      const erro = document.getElementById("erro");
      const btn = e.target.querySelector("button[type='submit']");

      erro.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Entrando...";

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

      if (error) {
        erro.textContent = "E-mail ou senha inválidos.";
        erro.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Entrar";
        return;
      }

      location.href = "app.html";
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/goteam/sw.js");
      });
    }
  </script>
</body>
</html>
